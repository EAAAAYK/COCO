  <body>
    <header class="header" id="header">
      <a class="header__logo" href="http://jisyuu.local/">

    <main>

          <a class="error-btn c-btn" href="">TOP</a>
        </div>
      </div>

    <footer class="footer ja" id="footer">

        <a class="footer__logo" href="http://jisyuu.local/">
          <img
            class="footer__logo-image"
